name: restore-chunk-00
on:
  push:
    paths:
      - ".github/workflows/restore-chunk-00.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified chunks/00.txt
        run: |
          set -euo pipefail
          git checkout 0a9ffb9ff27c756169ee87d14ffe8d5dc2107621 -- chunks/00.txt
          expected=7bf63ab19b4740ee2f5a1bf2b812b7605408d337abd6f8aa4d99a7fa848eebdf
          actual=$(sha256sum chunks/00.txt | awk '{print $1}')
          echo "size=$(wc -c < chunks/00.txt) hash=$actual"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chunks/00.txt
          git commit -m "Restore chunks/00.txt from verified import commit"
          git push
