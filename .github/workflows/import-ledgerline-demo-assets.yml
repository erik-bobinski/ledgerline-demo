name: import-ledgerline-demo-assets
on:
  push:
    paths:
      - .github/workflows/import-ledgerline-demo-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify assets
        run: |
          set -euo pipefail
          mkdir -p chunks
          download() {
            local dest="$1" url="$2" expect="$3"
            curl -fsSL -A curl -o "$dest" "$url"
            local got
            got="$(sha256sum "$dest" | awk '{print $1}')"
            if [ "$got" != "$expect" ]; then
              echo "hash mismatch $dest expected $expect got $got" >&2
              exit 1
            fi
            echo "ok $dest $got"
          }
          download chunks/00.txt https://litter.catbox.moe/oq5xuf.txt 7bf63ab19b4740ee2f5a1bf2b812b7605408d337abd6f8aa4d99a7fa848eebdf
          download chunks/01.txt https://litter.catbox.moe/3pe1am.txt d461dc3a7e43671fcaf431b55ebe200dbb65c7849f16132aad28f161f8df4acc
          download chunks/02.txt https://litter.catbox.moe/ykzp9f.txt 7656127ba5a794966f7cab7d526645565625978d4eafbd0a88ca2ba338f1e480
          download chunks/03.txt https://litter.catbox.moe/c48wbh.txt 1db473278cc6d14d0e4acd7290001eb236f40f86bb1b978a0d75a03ef6170a13
          download chunks/04.txt https://litter.catbox.moe/1pxjr0.txt ffe78b5355bc90770e6be31141a60f2eca308857f2f0c2506a86c9d9a45e6e21
          download chunks/05.txt https://litter.catbox.moe/3wvbak.txt ca13515c7ac4a23bd7c01d7c3b2eb3e06961fea6c7fb8cb75265c4bd20f6b0a7
          download dashboard.mp4 https://litter.catbox.moe/cit1mo.mp4 74266c572406c7e206ad6e65654da40d8d4f942acdb836170e882f8258992aa1
          rm -f chunks/_placeholder.txt chunks/_probe8k.txt
      - name: Commit assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chunks dashboard.mp4
          git status
          git commit -m "Add dashboard demo video and base64 chunks" || exit 0
          git push
