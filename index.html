<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ledgerline dashboard demo — leftover, spending, and transactions for a signed-in month."
    />
    <title>Ledgerline — dashboard demo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1.25rem 3rem;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
        background: #070707;
        color: #f4f4f5;
      }
      header {
        max-width: 52rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        font-size: 0.95rem;
        line-height: 1.45;
      }
      video {
        width: min(100%, 52rem);
        border-radius: 12px;
        background: #000;
        box-shadow: 0 0 0 1px #27272a;
      }
      .status {
        color: #a1a1aa;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Ledgerline</h1>
      <p>
        Signed-in month dashboard: leftover, where it went, and transactions.
      </p>
    </header>
    <p id="status" class="status">Loading demo…</p>
    <video
      id="demo"
      controls
      autoplay
      muted
      playsinline
      preload="metadata"
      hidden
    ></video>
    <script>
      const CHUNK_COUNT = 6;
      const HOSTED_MP4 =
        "https://cdn.jsdelivr.net/gh/erik-bobinski/ledgerline-demo@main/dashboard.mp4";
      async function loadDemo() {
        const status = document.getElementById("status");
        const video = document.getElementById("demo");
        for (const src of ["dashboard.mp4", HOSTED_MP4]) {
          try {
            const direct = await fetch(src, { method: "HEAD" });
            if (direct.ok) {
              video.src = src;
              video.hidden = false;
              status.remove();
              await video.play().catch(() => {});
              return;
            }
          } catch {
            /* try next source */
          }
        }
        const parts = await Promise.all(
          Array.from({ length: CHUNK_COUNT }, (_, i) =>
            fetch("chunks/" + String(i).padStart(2, "0") + ".txt").then(
              (res) => {
                if (!res.ok) throw new Error("Missing demo chunk " + i);
                return res.text();
              },
            ),
          ),
        );
        const binary = atob(parts.join(""));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        video.src = URL.createObjectURL(
          new Blob([bytes], { type: "video/mp4" }),
        );
        video.hidden = false;
        status.remove();
        await video.play().catch(() => {});
      }
      loadDemo().catch(() => {
        const status = document.getElementById("status");
        if (status) {
          status.textContent =
            "Could not load the demo video. Refresh, or open dashboard.mp4 if present.";
        }
      });
    </script>
  </body>
</html>
